name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCRCPY_VERSION: "3.3.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download scrcpy server
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/scrcpy-server.jar "https://github.com/Genymobile/scrcpy/releases/download/v${SCRCPY_VERSION}/scrcpy-server-v${SCRCPY_VERSION}"
          echo -n "${SCRCPY_VERSION}" > app/src/main/assets/scrcpy-version.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenBridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
